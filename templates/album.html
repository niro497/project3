<!DOCTYPE html>
<html>
<head>
    <title>{{ album_name }}</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>{{ album_name }}</h1>

    <a href="/albums">Back to Albums</a>

    <a href="/albums/{{ album_id }}/upload-photo">Upload Photo</a>

    <hr>

    {% if photos %}
        {% for photo in photos %}
            <div>
                <h3>{{ photo.caption }}</h3>
                <img src="{{ photo.data }}" style="max-width: 300px;">
            </div>
            <hr>
        {% endfor %}
    {% else %}
        <p>No photos in this album yet.</p>
    {% endif %}
</body>
</html>
