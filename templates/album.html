<!DOCTYPE html>
<html>
<head>
    <title>{{ album_name }}</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>{{ album_name }}</h1>

    {% if is_owner %}
        <form method="POST" action="/albums/{{ album_id }}/delete" onsubmit="return confirm('Are you sure you want to delete this album?');">
            <button type="submit">Delete Album</button>
        </form>
    {% endif %}

    <a href="/albums">Back to Albums</a>

    <a href="/albums/{{ album_id }}/upload-photo">Upload Photo</a>

    <hr>

    {% if photos %}
        {% for photo in photos %}
            <div>
                <a href = "/photos/{{ photo.photo_id }}">
                <img src="{{ photo.data }}" style = "max-width: 300px;">
            </div>
            <hr>
        {% endfor %}
    {% else %}
        <p>No photos in this album yet.</p>
    {% endif %}
</body>
</html>
