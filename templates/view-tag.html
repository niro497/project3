<!DOCTYPE html>
<html>
<head>
    <title>Photos for: {{ tag_name }}</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Photos with tag: #{{ tag_name }}</h1>

    <a href="/popular-tags">Back to Popular Tags</a>
    <hr>

    <div>
        <a href="/tags/{{ tag_name }}?filter=all">View All Photos</a> | 
        <a href="/tags/{{ tag_name }}?filter=mine">View My Photos</a>
    </div>
    <br>

    {% if photos %}
        {% for photo in photos %}
            <div>
                <h3>{{ photo.caption }}</h3>
                <img src="{{ photo.data }}" style="max-width: 300px;">
            </div>
            <hr>
        {% endfor %}
    {% else %}
        <p>No photos found for this tag.</p>
    {% endif %}

</body>
</html>
